<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Monthly website care</title>
  <link rel="stylesheet" href="gallery.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .crest {
      width: 640px;
      height: auto;
      display: block;
      position: relative;
      z-index: 1;
    }
    h1 {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      font-family: Cinzel, serif;
      font-weight: 600;
      font-size: 58px;
      line-height: 1;
      letter-spacing: 0.085em;
      color: #f6f1e4;
    }
    .rule {
      position: relative;
      z-index: 1;
      width: 88px;
      height: 1px;
      margin: 20px 0 18px;
      background: linear-gradient(90deg, transparent, #e8c547, transparent);
    }
    .prices {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 22px;
      font-family: Cinzel, serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: 0.08em;
      color: #f0d78c;
    }
    .prices span { color: #8a6d1a; font-size: 18px; }
    .kicker {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #d9cba8;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <img class="crest" src="crest.png" alt="Ivory Crown Collective" />
  <h1>MONTHLY WEBSITE CARE</h1>
  <div class="rule"></div>
  <p class="prices">$150 <span>◆</span> $400 <span>◆</span> $800</p>
  <p class="kicker">Updates · Bug fixes · IT support</p>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Full-viewport on phones / TikTok's in-app webview: no fixed scale, cover the notch area. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wheel of Fortune — TikTok Live Overlay</title>
<style>
  :root{
    --ink:#ffffff;
    --gold:#ffd60a;
    --pink:#ff2e88;
    --violet:#7c4dff;
    /* The wheel is sized from the *smaller* viewport axis so it is always a
       true circle, never stretched into an ellipse by the screen shape. */
    --wheel: min(94vw, 58dvh, 620px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }

  /* Root cause of the old squeeze: a fixed-size, max-width, centred stage.
     The fix: html/body and the overlay are pinned to all four viewport edges
     with no max-width, no margin:auto, and no transform:scale() anywhere on
     the stage. inset:0 (not just 100vw/100vh) also fills embedded webviews
     (TikTok / OBS CEF) where vw/vh units resolve against the wrong box. */
  html, body{ width:100%; height:100%; overflow:hidden; background:#12002e; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .overlay{
    position:fixed; inset:0;
    width:100dvw; height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:space-between;
    padding:
      max(14px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
    /* Vivid full-bleed backdrop that *covers* the whole screen on any
       aspect ratio. No dimming layer, no opacity, no dark overlay on top. */
    background:
      radial-gradient(120% 70% at 50% 0%, #5b12a8 0%, transparent 60%),
      radial-gradient(120% 80% at 50% 110%, #ff2e88 0%, transparent 55%),
      linear-gradient(180deg, #2a0066 0%, #4b0082 55%, #1a003d 100%);
    background-size:cover;
    overflow:hidden;
  }
  /* OBS / streaming-software mode: ?transparent=1 removes the backdrop so
     the game composites over the camera feed instead of a scene. */
  body.transparent, body.transparent .overlay{ background:transparent; }

  header{ text-align:center; width:100%; z-index:2; }
  .live{
    display:inline-block; background:#fe2c55; color:#fff; font-weight:800;
    letter-spacing:.14em; font-size:clamp(10px, 2.6vw, 14px);
    padding:.35em .8em; border-radius:999px; margin-bottom:.5em;
  }
  h1{
    font-size:clamp(28px, 9vw, 54px); line-height:.98; font-weight:900;
    letter-spacing:.01em; text-transform:uppercase;
    color:var(--gold);
    /* Contrast comes from shadow, not from dimming the artwork. */
    text-shadow:0 3px 0 #b25f00, 0 6px 22px rgba(0,0,0,.55);
  }
  .subtitle{ font-size:clamp(13px, 3.8vw, 19px); font-weight:600; opacity:1; margin-top:.45em; }

  .stage{
    flex:1 1 auto; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px, 2.4dvh, 22px); min-height:0;
  }
  .wheel-wrap{ position:relative; width:var(--wheel); height:var(--wheel); flex:0 0 auto; }
  .pointer{
    position:absolute; left:50%; top:-8px; transform:translateX(-50%);
    width:0; height:0; z-index:3;
    border-left:clamp(14px,4vw,22px) solid transparent;
    border-right:clamp(14px,4vw,22px) solid transparent;
    border-top:clamp(24px,7vw,38px) solid var(--gold);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.6));
  }
  /* Crisp vector-style wheel: a CSS conic gradient renders at the device's
     own resolution. Scaling a raster stage down (old behaviour) blurred it. */
  .wheel{
    position:absolute; inset:0; border-radius:50%;
    border:clamp(6px,1.8vw,10px) solid var(--gold);
    box-shadow:0 0 0 4px #7a4d00, 0 18px 50px rgba(0,0,0,.55), 0 0 60px rgba(255,214,10,.35);
    background:conic-gradient(from -22.5deg,
      #ff2e88 0deg 45deg, #ffb800 45deg 90deg, #00b8ff 90deg 135deg, #7c4dff 135deg 180deg,
      #00e676 180deg 225deg, #ff5722 225deg 270deg, #ffea00 270deg 315deg, #00e5ff 315deg 360deg);
    transform:rotate(var(--rot, 0deg));
    transition:transform 5.2s cubic-bezier(.12,.8,.08,1);
    cursor:pointer;
  }
  .wheel span{
    position:absolute; left:50%; top:50%; width:42%; height:0;
    transform-origin:0 0;
    font-weight:900; font-size:clamp(10px, calc(var(--wheel) * .048), 22px);
    letter-spacing:.02em; text-align:right; color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.75); white-space:nowrap;
  }
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26%; height:26%; border-radius:50%; z-index:2;
    background:radial-gradient(circle at 35% 30%, #fff6bf, var(--gold) 55%, #e09c00);
    border:4px solid #fff; color:#4a2600;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:clamp(14px, 5vw, 26px); letter-spacing:.06em;
    box-shadow:0 8px 24px rgba(0,0,0,.5); cursor:pointer; user-select:none;
  }
  .result{
    min-height:1.4em; text-align:center; font-weight:900;
    font-size:clamp(20px, 6.4vw, 36px); color:#fff;
    text-shadow:0 3px 14px rgba(0,0,0,.7);
  }
  .result:empty::before{ content:"Tap the wheel to spin"; font-size:clamp(14px,4vw,20px); font-weight:700; }

  .gifts{
    width:100%; display:grid; grid-template-columns:repeat(3, 1fr);
    gap:clamp(8px, 2.4vw, 14px); z-index:2;
  }
  .gift{
    background:rgba(10, 0, 32, .72); border:2px solid rgba(255,214,10,.85);
    border-radius:16px; padding:clamp(8px,2.4vw,14px) 6px; text-align:center;
  }
  .gift .icon{ font-size:clamp(24px, 8vw, 40px); line-height:1.1; }
  .gift .name{ font-weight:800; font-size:clamp(12px, 3.6vw, 17px); margin-top:.25em; }
  .gift .value{ font-size:clamp(11px, 3.2vw, 15px); color:var(--gold); font-weight:700; margin-top:.15em; }

  /* Wide screens (desktop OBS 16:9): still full-bleed, laid out in a row —
     never collapsed back into a centred narrow column. */
  @media (min-aspect-ratio: 1/1){
    .overlay{ flex-direction:row; gap:4vw; }
    header{ text-align:left; }
    .gifts{ grid-template-columns:1fr; max-width:320px; }
    :root{ --wheel: min(52vw, 82dvh, 640px); }
  }
  @media (prefers-reduced-motion: reduce){
    .wheel{ transition:none; }
  }
</style>
</head>
<body>
  <main class="overlay" id="overlay">
    <header>
      <div class="live">● LIVE</div>
      <h1 id="title">Wheel of Fortune</h1>
      <p class="subtitle" id="subtitle">Send a gift to spin the wheel!</p>
    </header>

    <section class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel" id="wheel" role="img" aria-label="Prize wheel"></div>
        <button class="hub" id="spinBtn" type="button">SPIN</button>
      </div>
      <p class="result" id="result" aria-live="polite"></p>
    </section>

    <footer class="gifts" aria-label="Gift values">
      <div class="gift"><div class="icon">🌹</div><div class="name">Rose</div><div class="value">1 Spin</div></div>
      <div class="gift"><div class="icon">🧢</div><div class="name">Cap</div><div class="value">3 Spins</div></div>
      <div class="gift"><div class="icon">💎</div><div class="name">Galaxy</div><div class="value">Jackpot Spin</div></div>
    </footer>
  </main>

<script>
  // Segments in the same clockwise order as the conic-gradient above.
  var SEGMENTS = ["JACKPOT","100 PTS","SPIN AGAIN","50 PTS","MYSTERY","500 PTS","EXTRA SPIN","25 PTS"];
  var params = new URLSearchParams(location.search);
  if (params.get("transparent") === "1" || params.get("bg") === "transparent") document.body.classList.add("transparent");
  if (params.get("title")) document.getElementById("title").textContent = params.get("title");
  if (params.get("subtitle")) document.getElementById("subtitle").textContent = params.get("subtitle");

  var wheel = document.getElementById("wheel");
  SEGMENTS.forEach(function(label, i){
    var s = document.createElement("span");
    s.textContent = label;
    // Centre each label in its 45deg slice, pushed out along the radius.
    s.style.transform = "rotate(" + (i * 45) + "deg) translateX(6%)";
    s.style.paddingRight = "4%";
    wheel.appendChild(s);
  });

  var rotation = 0, spinning = false;
  function spin(){
    if (spinning) return;
    spinning = true;
    var result = document.getElementById("result");
    result.textContent = "Spinning…";
    // 5+ full turns plus a random stop. Absolute rotation keeps the
    // transition moving forward instead of snapping backwards.
    rotation += 360 * 5 + Math.floor(Math.random() * 360);
    wheel.style.setProperty("--rot", rotation + "deg");
    setTimeout(function(){
      var atPointer = ((360 - (rotation % 360)) % 360);
      var winner = SEGMENTS[Math.floor(atPointer / 45) % SEGMENTS.length];
      result.textContent = "🎉 " + winner + "!";
      spinning = false;
    }, 5300);
  }
  document.getElementById("spinBtn").addEventListener("click", spin);
  wheel.addEventListener("click", spin);
  // A host page / streaming bridge can trigger a spin without a tap.
  window.addEventListener("message", function(e){ if (e.data && e.data.type === "spin") spin(); });
  if (params.get("spin") === "1") setTimeout(spin, 600);
</script>
</body>
</html>

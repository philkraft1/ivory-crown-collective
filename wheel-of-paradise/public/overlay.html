<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wheel of Fortune — Overlay</title>
<link rel="stylesheet" href="/ui.css" />
<style>
  :root { --tile: clamp(30px, 7.4vw, 62px); --wheel: min(46vw, 30dvh, 300px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #12002e; }
  body {
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding:
      max(14px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    background:
      radial-gradient(120% 70% at 50% 0%, #5b12a8 0%, transparent 60%),
      radial-gradient(120% 80% at 50% 110%, #ff2e88 0%, transparent 55%),
      linear-gradient(180deg, #2a0066 0%, #4b0082 55%, #1a003d 100%);
  }
  body.transparent, body.transparent .stage { background: transparent; }
  header { text-align: center; }
  .live {
    display: inline-block;
    background: #fe2c55;
    color: #fff;
    font-weight: 800;
    letter-spacing: 0.14em;
    font-size: 12px;
    padding: 0.35em 0.8em;
    border-radius: 999px;
  }
  h1 {
    margin-top: 8px;
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: clamp(28px, 6vw, 52px);
    color: #ffd60a;
    text-shadow: 0 3px 0 #b25f00;
    line-height: 0.95;
  }
  #category { margin-top: 6px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  #message {
    min-height: 1.3em;
    text-align: center;
    font-weight: 800;
    font-size: clamp(16px, 3vw, 28px);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
  }
  .play {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 0;
  }
  @media (min-aspect-ratio: 1/1) {
    :root { --wheel: min(30vw, 52dvh, 340px); --tile: clamp(28px, 4vw, 56px); }
    .play { flex-direction: row; }
    header { text-align: left; align-self: flex-start; }
  }
</style>
</head>
<body>
  <main class="stage">
    <header>
      <div class="live">● LIVE</div>
      <h1>Wheel of Fortune</h1>
      <p id="category"></p>
    </header>
    <section class="play">
      <div id="board" class="board" aria-live="polite"></div>
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true"></div>
        <div class="wheel" id="wheel" role="img" aria-label="Wheel"></div>
        <div class="hub" aria-hidden="true">WOF</div>
      </div>
    </section>
    <p id="message">Waiting for the host…</p>
    <ol id="scores" class="scores"></ol>
  </main>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
